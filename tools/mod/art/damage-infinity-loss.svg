<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="354" height="136" viewBox="0 0 354 136">
  <title>Damage infinity, loss</title>
  <desc>Original minus and infinity sign made for YO3 Revival in the style of the game's damage numbers (red for a loss). Use, modification and distribution in the project are permitted under the repository's MIT license. Drawn at 4x: 28 pixel strokes with an 8 pixel black outline.</desc>
  <defs>
    <path id="minus" d="M 30,68 H 84"/>
    <path id="infinity" d="M 232,68 L 206,22 H 156 Q 140,22 140,38 V 98 Q 140,114 156,114 H 206 L 258,22 H 308 Q 324,22 324,38 V 98 Q 324,114 308,114 H 258 Z"/>
  </defs>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <use href="#minus" xlink:href="#minus" stroke="#000000" stroke-width="40"/>
    <use href="#infinity" xlink:href="#infinity" stroke="#000000" stroke-width="44"/>
    <use href="#minus" xlink:href="#minus" stroke="#FD134F" stroke-width="24"/>
    <use href="#infinity" xlink:href="#infinity" stroke="#FD134F" stroke-width="28"/>
  </g>
</svg>
