proxy_pass http://unix:/run/yo3-dashboard/staff.sock;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
# Overwrite client-controlled values; Rust accepts these only on the mounted staff socket.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";
proxy_set_header Authorization "";
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_send_timeout 30s;
proxy_request_buffering on;
proxy_buffering off;
# Mutations never fail over or retry implicitly, including a lost response after a commit.
proxy_next_upstream off;
# Rust owns API CSP, cookie, no-store and other response headers; nginx adds only TLS policy.
add_header Strict-Transport-Security "max-age=31536000" always;
