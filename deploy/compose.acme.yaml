# First certificate only, before the dashboard can start. Stop after Certbot succeeds.
services:
  acme:
    image: nginx:stable-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    profiles: [certificate]
    entrypoint: [nginx, -g, 'daemon off;']
    ports: ["${YO3_WEB_BIND:-0.0.0.0}:${YO3_HTTP_PORT:-80}:8080"]
    volumes:
      - ./deploy/nginx/acme.conf:/etc/nginx/conf.d/default.conf:ro
      - ${YO3_ACME_DIR:?Set YO3_ACME_DIR}:/var/www/acme:ro
    restart: 'no'
