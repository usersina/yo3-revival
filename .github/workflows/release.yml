# A new CHANGELOG.md version runs lints/tests, builds the bundles, verifies packaged updater readiness on
# private Xvfb, then publishes the release with checksums. An already tagged version skips that job.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; a push made during a release waits for it
concurrency:
  group: hosted-delivery
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Changelog
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, home]
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      release: ${{ steps.changelog.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The newest version in CHANGELOG.md, and whether it is released
        id: changelog
        run: |
          version=$(python3 .github/scripts/release_notes.py check CHANGELOG.md Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::notice::$version is already released: add a new version at the top of CHANGELOG.md to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::releasing $version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Verify code and prepare ${{ needs.prepare.outputs.version }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: [self-hosted, home]
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust (with the Windows target) and mingw-w64, which links it
        run: |
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustup target add x86_64-pc-windows-gnu
          # OS dependencies are installed once on the home VM; jobs have no sudo.
          x86_64-w64-mingw32-gcc --version
          i686-w64-mingw32-gcc --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,actionlint
      - name: The rules engine's core sources, card scripts and card database
        run: engine/fetch.sh
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Headless client helper
        run: |
          # actionlint 1.7.12 predates GitHub's documented FIFO queue property; only that diagnostic is exempt.
          actionlint -ignore '^unexpected key "queue" for "concurrency" section\.' .github/workflows/*.yml
          python3 tools/mod/test_fixture_layout.py
          python3 tools/mod/test_winmm_exports.py
          python3 tools/client/test_vclient.py
          python3 tools/monkey/test_duel_report.py
          python3 tools/monkey/test_duel_replay.py
          python3 tools/test_package_editions.py
          python3 tools/test_release_notes.py
          python3 tools/test_release_lifecycle.py
          python3 tools/test_host_scripts.py
          python3 tools/containers/test_config.py
          python3 tools/containers/test_deployment.py
          python3 tools/containers/test_dashboard_delivery.py
          python3 tools/containers/test_dashboard_workflow.py
          python3 tools/test_docs_check.py
      - name: Documentation links and images
        run: tools/docs-check.py
      - name: Tests
        run: cargo nextest run --workspace
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Dashboard generated API client drift
        working-directory: dashboard
        run: npm run api:check
      - name: Dashboard checks
        working-directory: dashboard
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Dashboard browser and real API contracts
        working-directory: dashboard
        run: |
          npx playwright install chromium --only-shell
          npm run test:e2e -- --workers 2
      - name: Bundles
        if: needs.prepare.outputs.release == 'true'
        run: YO3_VERSION="$VERSION" tools/release.sh
      - name: The bundled rules engine plays every card of the client's era
        if: needs.prepare.outputs.release == 'true'
        run: |
          rm -rf dist/engine-check && mkdir -p dist/engine-check
          tar -xzf "dist/yo3-revival-desktop-$VERSION-linux-x86_64.tar.gz" -C dist/engine-check
          YO3_ENGINE_DIR="$PWD/dist/engine-check/yo3-revival-desktop/engine" \
            YO3_ENGINE="$PWD/dist/engine-check/yo3-revival-desktop/yo3-engine" cargo nextest run -p yo3-server --test engine_cards
      - name: Packaged Desktop updater opens before activation
        if: needs.prepare.outputs.release == 'true'
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Test from the currently published release, which survives the two-release retention policy.
          previous=$(python3 .github/scripts/release_lifecycle.py previous "$VERSION")
          mkdir -p dist/released
          gh release download "$previous" --dir dist/released --clobber -p "yo3-revival-desktop-$previous-linux-x86_64.tar.gz"
          tools/test-packaged-update.sh "$VERSION" "dist/yo3-revival-desktop-$VERSION-linux-x86_64.tar.gz" \
            --from "dist/released/yo3-revival-desktop-$previous-linux-x86_64.tar.gz"
      - name: Official server list
        if: needs.prepare.outputs.release == 'true'
        env:
          SERVER_LIST_KEY: ${{ secrets.SERVER_LIST_KEY }}
        run: |
          # Launchers fetch releases/latest/download/servers.json and trust only multiplayer::OFFICIAL_LIST_KEYS. The
          # private key (PKCS#8, base64 in the secret) only ever sits in a private temporary file; it is never echoed.
          [ -n "$SERVER_LIST_KEY" ] || { echo "The SERVER_LIST_KEY secret is missing" >&2; exit 1; }
          cargo build --release -p yo3-desktop --bin yo3-server-list
          key="$(umask 077 && mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SERVER_LIST_KEY" | base64 -d > "$key"
          mkdir -p assets
          target/release/yo3-server-list sign deploy/official-servers.json "$key" assets/servers.json
          public=$(sed -n 's/^pub const OFFICIAL_LIST_KEYS: &\[&str\] = &\["\([0-9a-f]\{64\}\)".*/\1/p' crates/yo3-desktop/src/multiplayer.rs)
          target/release/yo3-server-list verify assets/servers.json "$public"
      - name: SHA256SUMS
        if: needs.prepare.outputs.release == 'true'
        run: |
          mkdir -p assets
          for edition in desktop scripts; do
            cp "dist/yo3-revival-$edition-$VERSION-linux-x86_64.tar.gz" assets/
            cp "dist/yo3-revival-$edition-$VERSION-windows-x86_64.zip" assets/
          done
          cp "dist/yo3-revival-server-$VERSION-linux-x86_64.tar.gz" assets/
          python3 .github/scripts/release_notes.py sums assets
          (cd assets && sha256sum -c SHA256SUMS)
      - name: Sign SHA256SUMS
        if: needs.prepare.outputs.release == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # Desktop refuses an update whose SHA256SUMS.sig is missing or not the project's key (#32). The private key
          # only ever sits in a private temporary file, removed whatever happens; it is never echoed.
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "The UPDATE_SIGNING_KEY secret is missing" >&2; exit 1; }
          key="$(umask 077 && mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          .github/scripts/sign_release.sh assets "$key"
      - name: Release notes
        if: needs.prepare.outputs.release == 'true'
        run: |
          ls -l assets
          python3 .github/scripts/release_notes.py notes CHANGELOG.md assets > notes.md
          cat notes.md
      - name: Mention dashboard changes delivered before this release
        if: needs.prepare.outputs.release == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          state="$RUNNER_TEMP/yo3-notes-state-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          trap 'rm -f -- "$state"' EXIT
          if python3 .github/scripts/deploy_vps.py state > "$state"; then
            python3 .github/scripts/dashboard_delivery.py --state "$state" --candidate "$GITHUB_SHA" --release-notes >> notes.md
          else
            echo '::warning::Could not read previous dashboard delivery records; no early-delivery notes added.'
          fi
      - name: Release
        if: needs.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" assets/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION (beta)" \
            --notes-file notes.md \
            --latest

  containers:
    name: Publish release containers
    needs: [prepare, release]
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/containers.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source-ref: ${{ github.sha }}

  deploy:
    name: Update the hosted server
    needs: [prepare, release, containers]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.release == 'true'
    runs-on: [self-hosted, home]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy the successful release's exact images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: ${{ github.sha }}
          SERVER_IMAGE: ${{ needs.containers.outputs.server-image }}
          DASHBOARD_IMAGE: ${{ needs.containers.outputs.dashboard-image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/deploy_vps.py

  cleanup:
    name: Retain the newest two releases and images
    needs: [prepare, release, containers, deploy]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.release == 'true'
    runs-on: [self-hosted, home]
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Prepare private job credentials
        run: |
          umask 077
          for name in DOCKER_CONFIG GH_CONFIG_DIR; do
            path="$RUNNER_TEMP/yo3-release-$name-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            mkdir -p "$path"
            echo "$name=$path" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prove workflow-token package deletion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/package_probe.py
      - name: Remove old downloads and image versions after healthy deployment
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REF: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          state="$RUNNER_TEMP/yo3-release-state-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          trap 'rm -f -- "$state"' EXIT
          python3 .github/scripts/deploy_vps.py state > "$state"
          python3 .github/scripts/release_lifecycle.py prune "$VERSION" "$SOURCE_REF" --state "$state"
      - name: Remove job registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG" "$GH_CONFIG_DIR"
