# A new CHANGELOG.md version runs lints/tests, builds the bundles, verifies packaged updater readiness on
# private Xvfb, then publishes the release with checksums. An already tagged version skips that job.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; a push made during a release waits for it
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      release: ${{ steps.changelog.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The newest version in CHANGELOG.md, and whether it is released
        id: changelog
        run: |
          version=$(python3 .github/scripts/release_notes.py version CHANGELOG.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::notice::$version is already released: add a new version at the top of CHANGELOG.md to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::releasing $version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Verify code and prepare ${{ needs.prepare.outputs.version }}
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # The engine's sidecar and its tests run under the runner's Node.js; the bundles carry their own (release.sh)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rust (with the Windows target) and mingw-w64, which links it
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update -q
          sudo apt-get install -yq mingw-w64 pkg-config libxkbcommon-dev libwayland-dev libx11-dev xvfb xauth \
            libxcursor1 libx11-xcb1 libxi6 libxkbcommon-x11-0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: The rules engine's package, card scripts and card database
        run: engine/fetch.sh
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Headless client helper
        run: |
          python3 tools/mod/test_fixture_layout.py
          python3 tools/client/test_vclient.py
          python3 tools/monkey/test_duel_report.py
          python3 tools/monkey/test_duel_replay.py
          python3 tools/test_package_editions.py
          python3 tools/test_docs_check.py
      - name: Documentation links and images
        run: tools/docs-check.py
      - name: Tests
        run: cargo nextest run --workspace
      - name: Bundles
        if: needs.prepare.outputs.release == 'true'
        run: YO3_VERSION="$VERSION" tools/release.sh
      - name: Packaged Desktop updater opens before activation
        if: needs.prepare.outputs.release == 'true'
        timeout-minutes: 5
        run: tools/test-packaged-update.sh "$VERSION" "dist/yo3-revival-desktop-$VERSION-linux-x86_64.tar.gz"
      - name: Notes
        if: needs.prepare.outputs.release == 'true'
        run: |
          mkdir assets
          for edition in desktop scripts; do
            cp "dist/yo3-revival-$edition-$VERSION-linux-x86_64.tar.gz" assets/
            cp "dist/yo3-revival-$edition-$VERSION-windows-x86_64.zip" assets/
          done
          ls -l assets
          python3 .github/scripts/release_notes.py notes CHANGELOG.md assets > notes.md
          cat notes.md
      - name: Release
        if: needs.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" assets/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION (pre-alpha)" \
            --notes-file notes.md \
            --latest
