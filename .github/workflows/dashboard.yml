name: Deploy dashboard

on:
  # Release runs on every main push, including pushes with no new version. Reconcile after it completes.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Shared with Release, including its image publication and retention. Never cancel an active deployment.
concurrency:
  group: hosted-delivery
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deliver:
    if: >-
      github.repository == 'usersina/yo3-revival' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, home]
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare private job paths
        run: |
          umask 077
          for name in DOCKER_CONFIG GH_CONFIG_DIR STATE_JSON PLAN_JSON; do
            path="$RUNNER_TEMP/yo3-dashboard-$name-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "$name=$path" >> "$GITHUB_ENV"
            if [[ "$name" == *_DIR || "$name" == DOCKER_CONFIG ]]; then mkdir -p "$path"; fi
          done
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Read deployed state and plan against current main
        id: plan
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          python3 .github/scripts/deploy_vps.py state > "$STATE_JSON"
          python3 .github/scripts/dashboard_delivery.py --state "$STATE_JSON" --candidate "$(git rev-parse HEAD)" > "$PLAN_JSON"
          python3 - <<'PYTHON'
          import json, os
          value=json.load(open(os.environ['PLAN_JSON']))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('eligible='+str(value['eligible']).lower(),file=output)
              for key in ['server','released_dashboard','dashboard_commit']:
                  print(key+'='+value[key],file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              print('Eligible dashboard update.' if value['eligible'] else 'Dashboard deferred: '+ '; '.join(value['reasons']),file=summary)
          PYTHON
      - uses: actions/setup-node@v6
        if: steps.plan.outputs.eligible == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Check and build dashboard
        if: steps.plan.outputs.eligible == 'true'
        working-directory: dashboard
        env:
          VITE_DASHBOARD_COMMIT: ${{ steps.plan.outputs.dashboard_commit }}
        run: |
          npm ci
          npm run api:check
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx --no-install playwright install chromium --only-shell
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.plan.outputs.eligible == 'true'
      - uses: docker/login-action@v4.8.0
        if: steps.plan.outputs.eligible == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the asset-only image
        if: steps.plan.outputs.eligible == 'true'
        env:
          SERVER_IMAGE: ${{ steps.plan.outputs.server }}
          BASE_IMAGE: ${{ steps.plan.outputs.released_dashboard }}
          COMMIT: ${{ steps.plan.outputs.dashboard_commit }}
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY,,}-dashboard:dashboard-$COMMIT"
          echo "CANDIDATE_TAG=$tag" >> "$GITHUB_ENV"
          docker pull "$SERVER_IMAGE"
          docker pull "$BASE_IMAGE"
          docker build -f deploy/Dockerfile.dashboard-assets --build-arg RELEASED_DASHBOARD="$BASE_IMAGE" \
            --build-arg TESTED_SERVER="$SERVER_IMAGE" --build-arg DASHBOARD_COMMIT="$COMMIT" -t "$tag" dashboard/dist
      - name: Verify exact runtime and released-server browser behavior
        if: steps.plan.outputs.eligible == 'true'
        env:
          SERVER_IMAGE: ${{ steps.plan.outputs.server }}
          BASE_IMAGE: ${{ steps.plan.outputs.released_dashboard }}
        run: |
          python3 tools/containers/test_images.py --dashboard-only --dashboard "$CANDIDATE_TAG" --released-dashboard "$BASE_IMAGE"
          python3 tools/containers/test_dashboard_browser.py --server "$SERVER_IMAGE" --dashboard "$CANDIDATE_TAG"
      - name: Publish the verified dashboard
        if: steps.plan.outputs.eligible == 'true'
        run: |
          docker push "$CANDIDATE_TAG"
          python3 - <<'PYTHON'
          import json, os, subprocess
          tag=os.environ['CANDIDATE_TAG'];prefix=tag.split(':')[0]+'@'
          details=json.loads(subprocess.check_output(['docker','image','inspect',tag]))[0]
          ref=next(ref for ref in details['RepoDigests'] if ref.startswith(prefix))
          with open(os.environ['GITHUB_ENV'],'a') as output:print('CANDIDATE_IMAGE='+ref,file=output)
          PYTHON
      - name: Deploy the verified dashboard
        if: steps.plan.outputs.eligible == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.plan.outputs.dashboard_commit }}
        run: |
          request="$RUNNER_TEMP/yo3-dashboard-request-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 .github/scripts/dashboard_delivery.py --state "$STATE_JSON" --candidate "$COMMIT" \
            --dashboard-image "$CANDIDATE_IMAGE" > "$request"
          python3 .github/scripts/deploy_vps.py dashboard "$request"
      - name: Prove workflow-token package deletion
        if: steps.plan.outputs.eligible == 'true'
        run: python3 .github/scripts/package_probe.py
      - name: Retain release and active dashboard images
        if: steps.plan.outputs.eligible == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          python3 .github/scripts/deploy_vps.py state > "$STATE_JSON"
          read -r version commit < <(python3 -c 'import json,os; v=json.load(open(os.environ["STATE_JSON"])); print(v["version"],v["commit"])')
          python3 .github/scripts/release_lifecycle.py prune "$version" "$commit" --state "$STATE_JSON"
      - name: Remove job credentials and temporary records
        if: always()
        run: |
          rm -rf -- "$DOCKER_CONFIG" "$GH_CONFIG_DIR"
          rm -f -- "$STATE_JSON" "$PLAN_JSON" "$RUNNER_TEMP/yo3-dashboard-request-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
