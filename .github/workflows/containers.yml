# Called after Release succeeds. GITHUB_TOKEN-created releases do not trigger release event workflows.
name: Release containers

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source-ref:
        required: true
        type: string
    outputs:
      server-image:
        description: Immutable server image built from this release
        value: ${{ jobs.publish.outputs.server-image }}
      dashboard-image:
        description: Immutable dashboard image built from this release
        value: ${{ jobs.publish.outputs.dashboard-image }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    # runs-on: [self-hosted, home]  # the home VM runner, off until next month (2026-11-26)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      server-image: ${{ steps.references.outputs.server-image }}
      dashboard-image: ${{ steps.references.outputs.dashboard-image }}
    steps:
      - name: Prepare private job credentials
        run: |
          umask 077
          # Buildx's post action needs its metadata after registry credentials have been removed.
          for name in DOCKER_CONFIG GH_CONFIG_DIR BUILDX_CONFIG; do
            path="$RUNNER_TEMP/yo3-containers-$name-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            mkdir -p "$path"
            echo "$name=$path" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Require the newest published release tag at this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: python3 .github/scripts/release_lifecycle.py verify "$VERSION" "$SOURCE_REF"
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Check the one-time setup and runtime configuration
        run: |
          python -m pip install ansible-core==2.22.0
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
          python tools/containers/test_config.py
          python tools/containers/test_provisioning.py
          python tools/containers/test_deployment.py
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          name: yo3-release
          keep-state: true
          buildkitd-config: .github/buildkitd.toml
      - name: Check production dependency cache inputs
        run: python3 tools/containers/test_build_cache.py --builder yo3-release
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "base=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish the server and engine
        id: server
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.server
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.names.outputs.base }}-server:${{ inputs.version }}
            ${{ steps.names.outputs.base }}-server:sha-${{ inputs.source-ref }}
          build-args: |
            YO3_BUILD_VERSION=${{ inputs.version }}
            YO3_BUILD_COMMIT=${{ inputs.source-ref }}
            YO3_BUILD_JOBS=4
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source-ref }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Build and publish the dashboard and nginx
        id: dashboard
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.dashboard
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.names.outputs.base }}-dashboard:${{ inputs.version }}
            ${{ steps.names.outputs.base }}-dashboard:sha-${{ inputs.source-ref }}
          build-args: |
            YO3_BUILD_COMMIT=${{ inputs.source-ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source-ref }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Check the exact runtime images before deployment
        env:
          IMAGE_BASE: ${{ steps.names.outputs.base }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          DASHBOARD_DIGEST: ${{ steps.dashboard.outputs.digest }}
        run: |
          server="$IMAGE_BASE-server@$SERVER_DIGEST"
          dashboard="$IMAGE_BASE-dashboard@$DASHBOARD_DIGEST"
          docker pull "$server"
          docker pull "$dashboard"
          python3 tools/containers/test_images.py --server "$server" --dashboard "$dashboard"
          YO3_TEST_DASHBOARD="$dashboard" python3 tools/containers/test_dashboard_runtime.py
      - name: Attach exact image references to the release
        id: references
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source-ref }}
          IMAGE_BASE: ${{ steps.names.outputs.base }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          DASHBOARD_DIGEST: ${{ steps.dashboard.outputs.digest }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          env = os.environ
          manifest = {'version': env['VERSION'], 'commit': env['SOURCE_REF']}
          for name in ['server', 'dashboard']:
              manifest[name] = f"{env['IMAGE_BASE']}-{name}@{env[name.upper() + '_DIGEST']}"
          with open(env['GITHUB_OUTPUT'], 'a') as output:
              for name in ['server', 'dashboard']:
                  print(f'{name}-image={manifest[name]}', file=output)
          Path('container-images.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON
          gh release upload "$VERSION" container-images.json --clobber
      - name: Remove job registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG" "$GH_CONFIG_DIR"
