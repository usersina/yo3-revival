name: 🔌 I can't set it up or connect
description: Trouble installing, connecting, joining or hosting.
labels: ["setup help"]
body:
  - type: dropdown
    id: who
    attributes:
      label: Are you…
      options:
        - Playing on my own PC
        - A player joining a server
        - Hosting a server
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's going wrong?
      description: What you tried and what happened. If an error message shows, copy it here exactly as it is.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      description: "Desktop: click the footer version, then Copy version. Scripts: paste the output from the server's --version command."
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic logs (optional)
      description: "Desktop: Export logs below Start, or Advanced → Activity. Scripts: attach relevant session logs. Review first; never attach invitations, keys or databases."
  - type: dropdown
    id: pc
    attributes:
      label: Your PC
      options:
        - Windows
        - Linux (Wine)
        - Other
  - type: textarea
    id: security
    attributes:
      label: Security-software detection (if applicable)
      description: "Include the security product, exact detection name, affected filename and file SHA-256 if available. Do not disable protection. A disappeared file alone does not prove a detection."
  - type: checkboxes
    id: guide
    attributes:
      label: Before you post
      options:
        - label: I read the guide's [troubleshooting section](https://github.com/usersina/yo3-revival/blob/main/docs/launcher.md#troubleshooting).
          required: true
