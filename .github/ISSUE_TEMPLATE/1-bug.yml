name: 🐛 Something's broken
description: Something in the game or the server doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what went wrong. If you can, say what you did just before it happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Duel
        - Deck & cards
        - Shop & trades
        - Chat & friends
        - Logging in or joining
        - Launcher or updates
        - Hosting
        - Other
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Drag and drop an image here.
  - type: input
    id: version
    attributes:
      label: Application version
      description: Click the version at the bottom left, then Copy version in About & updates.
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic logs (optional)
      description: In Activity, choose Export logs and attach the ZIP here. Review it first; never attach invitations, keys or databases.
  - type: dropdown
    id: pc
    attributes:
      label: Your PC
      options:
        - Windows
        - Linux (Wine)
        - Other
