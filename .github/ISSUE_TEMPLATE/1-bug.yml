name: 🐛 Something's broken
description: Something in the game or the server doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what went wrong. If you can, say what you did just before it happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional. List the actions that lead to the problem, including card names for a duel issue.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Duel
        - Deck & cards
        - Shop & trades
        - Chat & friends
        - Logging in or joining
        - Launcher or updates
        - Hosting
        - Other
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or video
      description: Optional. Drag and drop a screenshot or a short video here.
  - type: input
    id: version
    attributes:
      label: Application version
      description: "Desktop: click the footer version, then Copy version. Scripts: paste the output from the server's --version command."
  - type: textarea
    id: logs
    attributes:
      label: Report ID or logs (optional)
      description: "Desktop's Help → Report a problem fills in a report ID (R-XXXX-XXXX): the logs went to the server's host, nothing to attach. A game that broke sends one by itself: its ID is in the game's session log (Problem report R-… sent). Otherwise attach an exported ZIP or Scripts session logs here. Never attach invitations, keys or databases."
  - type: textarea
    id: pc
    attributes:
      label: System details
      description: "Desktop fills these in from Report a problem. Otherwise, include your Windows or Linux version, architecture, and Wine version if used."
