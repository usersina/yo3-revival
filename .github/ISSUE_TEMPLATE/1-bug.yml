name: 🐛 Something's broken
description: Something in the game or the server doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what went wrong. If you can, say what you did just before it happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Duel
        - Deck & cards
        - Shop & trades
        - Chat & friends
        - Logging in or joining
        - Launcher or updates
        - Hosting
        - Other
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Drag and drop an image here.
  - type: input
    id: version
    attributes:
      label: Application version
      description: "Desktop: click the footer version, then Copy version. Scripts: paste the output from the server's --version command."
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic logs (optional)
      description: "Desktop: Export logs below Start, or Advanced → Activity. Scripts: attach relevant session logs. Review first; never attach invitations, keys or databases."
  - type: dropdown
    id: pc
    attributes:
      label: Your PC
      options:
        - Windows
        - Linux (Wine)
        - Other
