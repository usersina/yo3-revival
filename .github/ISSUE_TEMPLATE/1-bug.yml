name: 🐛 Something's broken
description: Something in the game or the server doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what went wrong. If you can, say what you did just before it happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional. List the actions that lead to the problem, including card names for a duel issue.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Duel
        - Deck & cards
        - Shop & trades
        - Chat & friends
        - Logging in or joining
        - Launcher or updates
        - Hosting
        - Other
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or video
      description: Optional. Drag and drop a screenshot or a short video here.
  - type: input
    id: version
    attributes:
      label: Application version
      description: "Desktop: click the footer version, then Copy version. Scripts: paste the output from the server's --version command."
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic logs (optional)
      description: "Desktop: Help & support → Report a problem publishes an issue with linked diagnostics after your confirmation. For a manual report, attach an exported ZIP or relevant Scripts session logs here. Review first; never attach invitations, keys or databases."
  - type: textarea
    id: pc
    attributes:
      label: System details
      description: "Desktop includes these details automatically when publishing from Report a problem. For a manual report, include your Windows or Linux version, architecture, and Wine version if used."
