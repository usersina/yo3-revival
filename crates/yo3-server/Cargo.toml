[package]
name = "yo3-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
subtle = "2.6.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yo3-data = { version = "0.1.0", path = "../yo3-data" }
yo3-proto = { version = "0.1.0", path = "../yo3-proto" }
yo3-tunnel = { path = "../yo3-tunnel" }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
