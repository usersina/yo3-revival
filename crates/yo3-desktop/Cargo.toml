[package]
name = "yo3-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "yo3-revival"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
if-addrs.workspace = true
iced = { workspace = true, features = ["tiny-skia", "tokio", "x11", "wayland", "fira-sans", "svg"] }
reqwest.workspace = true
semver.workspace = true
ring.workspace = true
tar.workspace = true
flate2.workspace = true
rfd.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
yo3-data.workspace = true
yo3-server.workspace = true
yo3-launcher.workspace = true
yo3-tunnel.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Registry"] }
