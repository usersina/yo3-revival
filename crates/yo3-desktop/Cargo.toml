[package]
name = "yo3-desktop"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yo3-revival"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
if-addrs = "0.15.0"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "fira-sans"] }
rfd = "0.18.0"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
yo3-data = { path = "../yo3-data" }
yo3-server = { path = "../yo3-server" }
yo3-launcher = { path = "../yo3-launcher" }
yo3-tunnel = { path = "../yo3-tunnel" }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Registry"] }
