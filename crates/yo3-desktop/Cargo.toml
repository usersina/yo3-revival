[package]
name = "yo3-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "yo3-revival"
path = "src/main.rs"

[dependencies]
getrandom.workspace = true
anyhow.workspace = true
chrono.workspace = true
if-addrs.workspace = true
keyring.workspace = true
base64.workspace = true
iced = { workspace = true, features = ["tiny-skia", "tokio", "x11", "wayland"] }
reqwest.workspace = true
webpki-root-certs.workspace = true
semver.workspace = true
ring.workspace = true
tar.workspace = true
flate2.workspace = true
rfd.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
yo3-data.workspace = true
yo3-server.workspace = true
yo3-skin.workspace = true
yo3-launcher.workspace = true
yo3-tunnel.workspace = true
zip.workspace = true

[build-dependencies]
png.workspace = true
winresource.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation"] }

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["test-util"] }
