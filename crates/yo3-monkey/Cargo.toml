[package]
name = "yo3-monkey"
version = "0.1.0"
edition = "2024"
description = "Protocol monkey: random, mutated and replayed traffic against a running yo3-server (a test tool, not part of the server)"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
yo3-proto = { version = "0.1.0", path = "../yo3-proto" }
