[package]
name = "yo3-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
yo3-proto = { path = "../yo3-proto" }
yo3-tunnel = { path = "../yo3-tunnel" }

[dev-dependencies]
yo3-server = { path = "../yo3-server" }
