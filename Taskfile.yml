version: '3'

# `task --list` is the menu. Arguments after `--` pass through: `task vm -- shot win7 screen.png`.
tasks:
  # The Compose stack (docs/docker.md)
  build:
    desc: Build the server and dashboard images
    cmds: [docker compose build]
  start:
    desc: Start the stack and wait for health checks
    cmds: [docker compose up -d --wait]
  stop:
    desc: Stop the stack (keep data and identities)
    cmds: [docker compose stop]
  status:
    desc: Show containers and health
    cmds: [docker compose ps]
  logs:compose:
    desc: Follow recent container logs
    cmds: [docker compose logs --tail=100 --follow]

  # Checks: tools/check.py is the one list, and CI's release job runs it too
  check:
    desc: "Every check CI's release job runs, in its order (or groups: task check -- py docs)"
    cmds: ['python3 tools/check.py {{.CLI_ARGS}}']
  check:list:
    desc: The check groups and their steps
    cmds: [python3 tools/check.py --list]
  check:py:
    desc: The hermetic Python tests (seconds)
    cmds: [python3 tools/check.py py]
  check:docs:
    desc: Every relative link and anchor in the Markdown
    cmds: [python3 tools/check.py docs]
  check:lint:
    desc: actionlint and Clippy
    cmds: [python3 tools/check.py lint]
  check:rust:
    desc: The engine sources, then every Rust test (about a minute after building)
    cmds: [python3 tools/check.py rust]
  check:dashboard:
    desc: The dashboard's API drift, format, lint, types, unit tests and build
    cmds: [python3 tools/check.py dashboard]
  check:mod:
    desc: "Local only: the connection DLL's Wine tests (private :78; YO3_WINEPREFIX=fresh private prefix, YO3_GAME_DIR for direct start)"
    cmds: [python3 tools/check.py mod]
  check:cards:
    desc: The duel check's 240 self-played duels, then which card effects they exercised (tools/engine/coverage.py)
    cmds:
      - cargo nextest run -p yo3-server --test duel_check
      - python3 tools/engine/coverage.py {{.CLI_ARGS}}

  check:fuzz:
    desc: "The per-card fuzz: chosen added cards in self-played duels, a report of effects never activated or never doing what they declare (YO3_FUZZ_ROWS=a-b or YO3_FUZZ_CARDS=id,id; YO3_FUZZ_DUELS)"
    cmds:
      - cargo nextest run --release -p yo3-server --test card_fuzz --no-capture

  check:selfplay:
    desc: "Long self-play: 300 duels each with the added cards and with the anime versions on (slow engine answers fail too)"
    cmds:
      - cargo nextest run --release -p yo3-server --test duel_check -E 'test(duels_with_the_added_cards) | test(duels_with_the_anime_versions_on)'
    env:
      YO3_CHECK_DUELS: "300"

  check:added:
    desc: "After adding cards: the generated card files, then every added card's tests (smoke, scenarios, self-played duels)"
    cmds:
      - python3 tools/engine/added-cards.py --check
      - python3 tools/engine/anime-map.py --check
      - python3 tools/engine/anime-pictures.py --check
      - cargo build --release -p yo3-engine
      - cargo nextest run --release -p yo3-server -E 'binary(added_cards_smoke) | binary(added_cards) | binary(added_batch) | binary(material_search) | test(duels_with_the_added_cards)'
    env:
      YO3_SMOKE: all

  check:smoke:
    desc: "The added cards' smoke test for the cards changed since the last release, and today's tenth (YO3_SMOKE=all: every card; YO3_SMOKE=5217-5258: rows)"
    cmds:
      - cargo nextest run --release -p yo3-server --test added_cards_smoke --no-capture
    env:
      YO3_SMOKE: '{{.YO3_SMOKE | default "changed"}}'

  check:shipped:
    desc: "The server's and engine's tests against a built bundle's pruned engine (-- dist/.editions/linux-x86_64/desktop/yo3-revival-desktop --release)"
    cmds:
      - tools/engine/test-shipped.sh {{.CLI_ARGS}}

  check:decks:
    desc: "The preset decks' cards (starter, structure and NPC decks) self-played, then their effect cards no duel exercised (tools/engine/coverage.py --decks)"
    cmds:
      - cargo nextest run -p yo3-server --test deck_coverage
      - python3 tools/engine/coverage.py --decks {{.CLI_ARGS}}

  # Cards the game never had (docs/added-cards.md)
  cards:find:
    desc: "Whether cards can be added, their table lines and the script lines to read (-- \"Card Name\" ... | --find-file FILE)"
    cmds:
      - python3 tools/engine/added-cards.py --find {{.CLI_ARGS}}
  cards:add:
    desc: "Add cards to both tables and rebuild (-- \"Card Name\" ... --note \"who asked, #issue\" [--checked])"
    cmds:
      - python3 tools/engine/added-cards.py --add {{.CLI_ARGS}}

  # Builds
  build:dev:
    desc: Release builds of the server, launchers, Desktop and engine, and the connection DLL, as dev builds
    cmds:
      # A YO3_VERSION left in the shell bakes release metadata into these, and the launcher then refuses them
      # ("Bundle manifest is missing", a DLL version mismatch).
      - env -u YO3_VERSION cargo build --release -p yo3-server -p yo3-launcher -p yo3-desktop -p yo3-engine
      - env -u YO3_VERSION tools/mod/build.sh
  build:mod:
    desc: The connection DLL, injector and test harnesses (local mingw-w64)
    cmds: [tools/mod/build.sh]
  build:mod:ci:
    desc: The connection DLL as the release builds it (Ubuntu mingw-w64 in Docker, msvcrt), for real Windows VMs
    cmds: [tools/mod/build-ci.sh]
  release:
    desc: Desktop, Scripts and Server bundles into dist/ (set YO3_VERSION for a release build)
    cmds: [tools/release/release.sh]

  # Docs
  docs:toc:
    desc: "A table of contents for a Markdown file: task docs:toc -- docs/launcher.md"
    cmds: ['python3 tools/docs/docs-check.py --toc {{.CLI_ARGS}}']

  # Scratch servers beside a live one (never 7443/8080)
  dev:server:
    desc: "Start a scratch server with key accounts (task dev:server -- --accounts 2 | --from-db FILE --profile-for WHO)"
    cmds: ['python3 tools/dev/scratch-server.py start {{.CLI_ARGS}}']
  dev:server:env:
    desc: The export lines for a client terminal (the newest scratch server)
    cmds: ['python3 tools/dev/scratch-server.py env {{.CLI_ARGS}}']
  dev:server:status:
    desc: Whether the newest scratch server runs
    cmds: ['python3 tools/dev/scratch-server.py status {{.CLI_ARGS}}']
  dev:server:stop:
    desc: Stop the newest scratch server (its files stay)
    cmds: ['python3 tools/dev/scratch-server.py stop {{.CLI_ARGS}}']

  # The headless game client and the Windows VMs
  client:
    desc: "The headless client on a private display: task client -- start | login 0 | ui | shot NAME | stop"
    cmds: ['tools/client/vclient.sh {{.CLI_ARGS}}']
  logs:
    desc: "Read logs as one timeline (yo3-log/1 and older): task logs -- PATH... [--level warn] [--user N] [--json] (docs/logs.md)"
    cmds: ['python3 tools/logs/yo3log.py {{.CLI_ARGS}}']
  client:scenario:
    desc: "A scripted UI scenario on the running headless client: task client:scenario -- tools/client/scenarios/FILE.scn"
    cmds: ['python3 tools/client/ui-scenario.py {{.CLI_ARGS}}']
  vm:
    desc: "The Windows VMs: task vm -- list | shot win7 FILE | click win7 X Y | run win7 -- ver (tools/vm/vm.py --help)"
    cmds: ['python3 tools/vm/vm.py {{.CLI_ARGS}}']
  vm:smoke:
    desc: "The standard Windows check of the newest dist/ Desktop bundle on the win11 VM: login, the chat's Lobby, chat, a command (tools/vm/smoke.py --help)"
    cmds: ['python3 tools/vm/smoke.py {{.CLI_ARGS}}']
