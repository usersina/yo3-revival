[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.26"
edition = "2024"
license = "MIT"
# The compiler baseline verified for this workspace; newer toolchains are also supported.
rust-version = "1.98.1"

[workspace.dependencies]
toml = "0.8"
# Shared versions and common features. Platform-specific features stay with the consuming crate.
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22.1"
blowfish = "0.10.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dunce = "1.0.5"
flate2 = "1.1.11"
getrandom = "0.4.3"
iced = { version = "0.14.0", default-features = false }
if-addrs = "0.15.0"
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "service"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
jpeg-encoder = { version = "0.7.0", default-features = false }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
png = "0.17.16"
proptest = "1.12.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rfd = "0.18.0"
ring = "0.17.14"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tar = "0.4.46"
thiserror = "2.0.21"
socket2 = { version = "0.6.5", features = ["all"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }
utoipa = { version = "6.0.0", features = ["chrono"] }
utoipa-axum = "0.3.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-sys = "0.61.2"
webpki-root-certs = "1.0.12"
winresource = { version = "0.1.34", default-features = false }
x509-parser = "0.18.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

# Internal crates inherit the one package version above; these paths are relative to this manifest.
yo3-data = { path = "crates/yo3-data" }
yo3-launcher = { path = "crates/yo3-launcher" }
yo3-proto = { path = "crates/yo3-proto" }
yo3-server = { path = "crates/yo3-server" }
yo3-skin = { path = "crates/yo3-skin" }
yo3-tunnel = { path = "crates/yo3-tunnel" }

[workspace.lints.rust]
# Native Windows integration requires FFI. Keep unsafe operations explicit inside unsafe functions too.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
large_futures = "warn"
non_std_lazy_statics = "warn"
